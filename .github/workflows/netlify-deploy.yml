name: Deploy Property Zone OTP to Netlify

on:
  workflow_dispatch:
  push:
    branches:
      - netlify-otp

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Property Zone
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: npm install --omit=dev

      - name: Deploy site and serverless functions
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" || (echo "Missing NETLIFY_AUTH_TOKEN secret" && exit 1)
          test -n "$NETLIFY_SITE_ID" || (echo "Missing NETLIFY_SITE_ID secret" && exit 1)
          npx --yes netlify-cli deploy --prod --dir . --functions netlify/functions --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN"
