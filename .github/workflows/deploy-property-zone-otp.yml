name: Deploy Property Zone OTP Worker
on:
  workflow_dispatch:
  push:
    branches: [cloudflare-otp-deploy]
    paths:
      - "workers/property-zone-otp/**"
      - ".github/workflows/deploy-property-zone-otp.yml"
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy workers/property-zone-otp/index.js --name property-zone-otp --compatibility-date 2026-11-17
          secrets: |
            ONE9_API_KEY
        env:
          ONE9_API_KEY: ${{ secrets.ONE9_API_KEY }}
