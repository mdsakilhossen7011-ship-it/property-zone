name: Deploy Property Zone OTP Worker
on:
  workflow_dispatch:
  push:
    branches: [cloudflare-otp-deploy]
    paths:
      - "workers/property-zone-otp/**"
      - ".github/workflows/deploy-property-zone-otp.yml"
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Worker and upload One9 secret
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: "workers/property-zone-otp"
          command: deploy
          secrets: |
            ONE9_API_KEY
            FIREBASE_SERVICE_ACCOUNT_JSON
        env:
          ONE9_API_KEY: ${{ secrets.ONE9_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

# Refresh deployment from the verified cloudflare-otp-deploy worker source.
