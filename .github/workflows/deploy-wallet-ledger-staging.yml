name: Deploy wallet ledger staging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Guard against production Firebase project
        working-directory: wallet-ledger-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const text = fs.readFileSync("wrangler.staging.toml", "utf8");
            const match = text.match(/FIREBASE_PROJECT_ID\s*=\s*"([^"]+)"/);
            const project = match?.[1] || "";
            if (!process.env.CLOUDFLARE_ACCOUNT_ID || !process.env.CLOUDFLARE_API_TOKEN) {
              console.error("Missing CLOUDFLARE_ACCOUNT_ID or CLOUDFLARE_API_TOKEN GitHub secret.");
              process.exit(1);
            }
            if (!project || project === "REPLACE_WITH_STAGING_FIREBASE_PROJECT_ID" || project === "property-zone-17121") {
              console.error("Set FIREBASE_PROJECT_ID in wrangler.staging.toml to a separate staging Firebase project before deploying.");
              process.exit(1);
            }
          '

      - name: Deploy isolated staging Worker
        working-directory: wallet-ledger-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy --config wrangler.staging.toml
