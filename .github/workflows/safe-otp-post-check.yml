name: Safe Property Zone OTP POST Check

on:
  push:
    branches: [cloudflare-otp-deploy]
    paths:
      - ".github/workflows/safe-otp-post-check.yml"

permissions:
  contents: write

jobs:
  safe-post-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-otp-deploy
      - name: POST an invalid phone number (must stop before SMS)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          response_file="$(mktemp)"
          status="$(curl -sS -o "$response_file" -w '%{http_code}' \
            -X POST 'https://property-zone-otp.mdsakilhossen409.workers.dev/otp-send' \
            -H 'Content-Type: application/json' \
            --data '{"phone":"not-a-phone"}')"
          curl_exit=$?
          body="$(cat "$response_file" 2>/dev/null)"
          if [[ "$curl_exit" -eq 0 && "$status" == "400" ]] && grep -q 'Enter a valid Bangladesh phone number' "$response_file"; then
            result="PASS"
            detail="POST reached the Worker and invalid phone was rejected before the One9 SMS step."
          else
            result="FAIL"
            detail="curl_exit=$curl_exit; HTTP_STATUS=$status; response=$body"
          fi
          {
            echo "result=$result"
            echo "http_status=$status"
            echo "curl_exit=$curl_exit"
            echo "response=$body"
            echo "detail=$detail"
          } > safe-otp-post-check-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add safe-otp-post-check-result.txt
          git commit -m "Record safe OTP POST check result" || true
          git push origin HEAD:cloudflare-otp-deploy
          echo "$detail"
          [[ "$result" == "PASS" ]]
