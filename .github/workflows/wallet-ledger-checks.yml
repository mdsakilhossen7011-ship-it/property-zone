name: Wallet Ledger Preparation Checks

on:
  pull_request:
    paths:
      - "scripts/audit-wallet-ledger-migration.js"
      - "package.json"
      - "backend/**"
      - "wallet-ledger-worker/**"
      - ".github/workflows/wallet-ledger-checks.yml"
  push:
    branches:
      - "feature/segregated-wallet-backend-2026-11-17"
    paths:
      - "scripts/audit-wallet-ledger-migration.js"
      - "package.json"
      - "backend/**"
      - "wallet-ledger-worker/**"
      - ".github/workflows/wallet-ledger-checks.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check audit script syntax
        run: node --check scripts/audit-wallet-ledger-migration.js
      - name: Check Worker module syntax
        run: node --input-type=module --check < wallet-ledger-worker/src/index.js
      - name: Run wallet ledger unit tests
        run: node --test wallet-ledger-worker/test/*.test.js
      - name: Check package metadata
        run: node -e "const p=require('./package.json'); if(!p.scripts['audit:wallet-ledger']) process.exit(1)"
