name: Firebase Wallet Checks

on:
  pull_request:
    paths:
      - "scripts/credit-daily-earnings.js"
      - "index.html"
      - "scripts/check-inline-scripts.js"
      - ".github/workflows/wallet-ledger-checks.yml"
  push:
    branches:
      - "feature/segregated-wallet-backend-2026-11-17"
    paths:
      - "scripts/credit-daily-earnings.js"
      - "index.html"
      - "scripts/check-inline-scripts.js"
      - ".github/workflows/wallet-ledger-checks.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check customer site inline JavaScript
        run: node scripts/check-inline-scripts.js index.html
      - name: Check daily earnings script syntax
        run: node --check scripts/credit-daily-earnings.js
